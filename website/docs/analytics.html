<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - EShop InventoryIQ</title>
    <link rel="stylesheet" href="../styles/dashboard.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body class="dashboard-body">
    <div class="dashboard-container">
        <header class="main-header">
            <div class="header-content">
                <h1>EShop InventoryIQ</h1>
                <h2>Forecasting & Management System</h2>
            </div>
        </header>
        <nav class="sidebar">
            <ul class="sidebar-menu">
                <li class="menu-item">
                    <a href="dashboard.html">
                        <i class="fas fa-th-large"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="inventory.html">
                        <i class="fas fa-box"></i>
                        <span>Inventory</span>
                    </a>
                </li>
                <li class="menu-item active">
                    <a href="analytics.html">
                        <i class="fas fa-chart-bar"></i>
                        <span>Analytics</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="settings.html">
                        <i class="fas fa-cog"></i>
                        <span>Settings</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="#" id="logoutBtn">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Log Out</span>
                    </a>
                </li>
            </ul>
        </nav>
        
        <main class="main-content">
            <div class="content-area">
                <div class="analytics-content">
                    <div class="analytics-header">
                        <h2>Analytics Dashboard</h2>
                        <div class="date-range-picker">
                            <input type="date" id="startDate">
                            <input type="date" id="endDate">
                            <button class="apply-date">Apply</button>
                        </div>
                    </div>
                    <div class="analytics-cards">
                        <div class="analytics-card">
                            <h3>Total Sales</h3>
                            <p class="card-value" id="totalSales">₱0.00</p>
                            <p class="card-change positive">+15% vs last period</p>
                        </div>
                        <div class="analytics-card">
                            <h3>Total Orders</h3>
                            <p class="card-value" id="totalOrders">0</p>
                            <p class="card-change positive">+8% vs last period</p>
                        </div>
                        <div class="analytics-card">
                            <h3>Average Order Value</h3>
                            <p class="card-value" id="avgOrderValue">₱0.00</p>
                            <p class="card-change negative">-3% vs last period</p>
                        </div>
                    </div>
                    <div class="charts-container">
                        <div class="chart-wrapper">
                            <h3>Sales Trend</h3>
                            <canvas id="salesChart"></canvas>
                        </div>
                        <div class="chart-wrapper">
                            <h3>Top Products</h3>
                            <canvas id="productsChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../js/login-auth/firebase-auth.js"></script>
    <script src="../js/analytics.js"></script>
</body>
</html>
