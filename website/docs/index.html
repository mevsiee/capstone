<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eshop InventoryIQ Login</title>
    <link rel="stylesheet" href="../styles/login.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="../js/login-auth/toggle-password.js"></script>
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <h1 class="login-title">EShop InsightIQ</h1>
            <h2 class="login-subtitle">Analytics and Forecasting System</h2><br/>
            <p class="login-desc">Transform data into your competitive advantage.</p>

            <form id="loginForm">
                <label for="username" class="form-label">Email Address</label>
                <input type="email" id="username" placeholder="Enter your email" required class="form-input">
                <br/><br/>
                <label for="password" class="form-label">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Enter your password" required class="form-input">
                    <i class="fas fa-eye toggle-password"></i>
                </div>

                <div id="loginError" style="color: red; font-size: 0.9em; margin-top: 5px;"></div>
                <br/>
                <button type="submit" class="btn-primary">Sign In</button>
            </form>

            <div class="divider"></div>

            <button type="button" class="google-btn" id="googleSignIn">
                <i class="fab fa-google"></i> Sign in with Google
            </button>
        </div>
    </div>

    <script src="../js/login-auth/firebase-auth.js"></script>
</body>
</html>
