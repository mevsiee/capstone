<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Login</title>
    <link rel="stylesheet" href="/styles/login.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    
</head>
<body>
    <div class="login-container">
        <div class="login-left">
            <div class="welcome-content">
                <h1>Welcome to website</h1>
                <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed diam nonummy nibh euismod tincidunt ut laoreet dolore magna aliquam erat volutpat.</p>
            </div>
            <div class="geometric-shapes">
                <div class="shape circle-1"></div>
                <div class="shape circle-2"></div>
                <div class="shape line-1"></div>
                <div class="shape line-2"></div>
                <div class="shape line-3"></div>
                <div class="shape line-4"></div>
            </div>
        </div>
        
        <div class="login-right">
            <div class="login-form">
                <h2>USER LOGIN</h2>
                <form id="loginForm">
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" placeholder="Username" required>
                    </div>
                    
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Password" required>
                    </div>

                    <div id="loginError" style="color: red; font-size: 0.9em; margin-top: 5px;"></div>

                    <button type="submit" class="login-btn">LOGIN</button>
                    
                    <div class="divider">
                        <span>OR</span>
                    </div>
                    
                    <button type="button" class="google-btn" id="googleSignIn">
                        <i class="fab fa-google"></i>
                        Sign in with Google
                    </button>
                </form>
            </div>
        </div>
    </div>
    
    <script src="/js/login-auth/firebase-auth.js"></script>
</body>
</html>
