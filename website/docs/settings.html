<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - EShop InventoryIQ</title>
    <link rel="stylesheet" href="../styles/dashboard.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body class="dashboard-body">
    <div class="dashboard-container">
        <header class="main-header">
            <div class="header-content">
                <h1>EShop InventoryIQ</h1>
                <h2>Forecasting & Management System</h2>
            </div>
        </header>
        <nav class="sidebar">
            <ul class="sidebar-menu">
                <li class="menu-item">
                    <a href="dashboard.html">
                        <i class="fas fa-th-large"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="inventory.html">
                        <i class="fas fa-box"></i>
                        <span>Inventory</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="analytics.html">
                        <i class="fas fa-chart-bar"></i>
                        <span>Analytics</span>
                    </a>
                </li>
                <li class="menu-item active">
                    <a href="settings.html">
                        <i class="fas fa-cog"></i>
                        <span>Settings</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="#" id="logoutBtn">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Log Out</span>
                    </a>
                </li>
            </ul>
        </nav>
        
        <main class="main-content">
            <div class="content-area">
                <div class="settings-content">
                    <div class="settings-header">
                        <h2>Settings</h2>
                    </div>
                    <div class="settings-sections">
                        <section class="settings-section">
                            <h3>Profile Settings</h3>
                            <form id="profileForm" class="settings-form">
                                <div class="form-group">
                                    <label for="userName">Name</label>
                                    <input type="text" id="userName" placeholder="Your name">
                                </div>
                                <div class="form-group">
                                    <label for="userEmail">Email</label>
                                    <input type="email" id="userEmail" placeholder="Your email" readonly>
                                </div>
                                <button type="submit" class="save-btn">Save Changes</button>
                            </form>
                        </section>
                        
                        <section class="settings-section">
                            <h3>Password</h3>
                            <form id="passwordForm" class="settings-form">
                                <div class="form-group">
                                    <label for="currentPassword">Current Password</label>
                                    <input type="password" id="currentPassword" placeholder="Enter current password">
                                </div>
                                <div class="form-group">
                                    <label for="newPassword">New Password</label>
                                    <input type="password" id="newPassword" placeholder="Enter new password">
                                </div>
                                <div class="form-group">
                                    <label for="confirmPassword">Confirm New Password</label>
                                    <input type="password" id="confirmPassword" placeholder="Confirm new password">
                                </div>
                                <button type="submit" class="save-btn">Update Password</button>
                            </form>
                        </section>
                        
                        <section class="settings-section">
                            <h3>Notifications</h3>
                            <div class="settings-options">
                                <div class="setting-option">
                                    <label class="switch">
                                        <input type="checkbox" id="emailNotifications">
                                        <span class="slider"></span>
                                    </label>
                                    <span>Email Notifications</span>
                                </div>
                                <div class="setting-option">
                                    <label class="switch">
                                        <input type="checkbox" id="lowStockAlerts">
                                        <span class="slider"></span>
                                    </label>
                                    <span>Low Stock Alerts</span>
                                </div>
                            </div>
                        </section>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    
    <!-- Initialize Firebase -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCAg8tRotR85IWP2qehTLKn5mMSAK_Hu1g",
            authDomain: "eshop-44c5e.firebaseapp.com",
            projectId: "eshop-44c5e",
            storageBucket: "eshop-44c5e.firebasestorage.app",
            messagingSenderId: "1037520511366",
            appId: "1:1037520511366:web:dbd821023be0c3aa48cc07",
            measurementId: "G-NVTV17LBHP"
        };
        
        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
    </script>
    
    <!-- Application Scripts -->
    <script src="../js/settings.js"></script>
</body>
</html>
