<body class="dashboard-body">

        <h1>EShop InventoryIQ</h1>
        <h2>Forecasting & Management System</h2>
      </div>
    </header>

    <nav class="sidebar">
      <ul class="sidebar-menu">
        <li class="menu-item"><a href="dashboard.html"><i class="fas fa-th-large"></i><span>Dashboard</span></a></li>
