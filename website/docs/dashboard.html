<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="/styles/dashboard.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    

</head>
<body class="dashboard-body">
    <div class="dashboard-container">
        <nav class="sidebar">
            <div class="sidebar-header">
                <h3>ESHOP CLOTHING</h3>
            </div>
            
            <ul class="sidebar-menu">
                <li class="menu-item active">
                    <a href="#" data-section="main-dashboard">
                        <i class="fas fa-tachometer-alt"></i>
                        <span>Main Dashboard</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="#" data-section="analytics">
                        <i class="fas fa-chart-bar"></i>
                        <span>Analytics</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="#" data-section="inventory">
                        <i class="fas fa-boxes-stacked"></i>
                        <span>Inventory</span>
                    </a>
                </li>
            </ul>
            
            <div class="sidebar-footer">
                <button class="logout-btn" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </button>
            </div>
        </nav>
        
        <main class="main-content">
            <header class="content-header"> 
                <h1 id="pageTitle">Main Dashboard</h1>
                <div class="user-info">
                    <span>Welcome </span>
                </div>
            </header>
            
            <div class="content-area">
                <div id="main-dashboard" class="content-section active">
                    <div class="placeholder-content">
                            <iframe
                                id="lookerReport"
                                width="100%"
                                height="750"
                                src="https://lookerstudio.google.com/embed/reporting/d9d56361-72fb-467a-a307-d7355cbbbc18/page/oZmQF"
                                frameborder="0"
                                style="border:0"
                                allowfullscreen
                                sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
                            </iframe>
                    </div>
                </div>
                
                <div id="analytics" class="content-section">
                    <div class="placeholder-content">
                          
                    </div>
                </div>
                    <div id="inventory" class="content-section">
                    <div class="placeholder-content">
                        <i class="fas fa-analytics"></i>
                        <h3>inventory</h3>
                        <p>This section is ready for your Looker analytics</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="/js/UI/dashboard.js"></script>
    <script src="/js/login-auth/dashboard-auth.js"></script>
    
</body>
</html>
